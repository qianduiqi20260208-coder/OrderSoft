database = Model_Life_Manager_test

[connection_pool]
min_connections = 5
max_connections = 20
connection_timeout = 30
idle_timeout = 300
max_idle_time = 600

[storage]
upload_dir = D:/_git/Upload

[logging]
# 日志基础路径
log_base_path = logs
# 最小日志级别: DEBUG=0, INFO=1, WARNING=2, ERROR=3, FATAL=4
min_log_level = 1
# 日志文件保留天数
log_retention_days = 30
# 是否同时输出到控制台
console_output = true